<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TikTok-Style Comment Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* ---existing styles--- */
      :root { --bg: #0b0b0c; /* dark ui */ --panel: #121215; --border: #29292e; --muted: #9aa0a6; --text: #e9eaee; --accent: #eeeff2; --heart: #e63946; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji"; background: linear-gradient(180deg, var(--bg), #0f0f12); color: var(--text); }
      .app { display: grid; grid-template-columns: 380px 1fr; gap: 24px; max-width: 1100px; margin: 40px auto; padding: 24px; }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; }
      .form { padding: 18px; }
      label { display: block; margin: 10px 2px 6px; font-size: 12px; color: var(--muted); }
      input[type="text"], input[type="number"], textarea { width: 100%; padding: 12px 14px; font-size: 14px; color: var(--text); background: #0e0e11; border: 1px solid var(--border); border-radius: 10px; outline: none; }
      textarea { min-height: 90px; resize: vertical; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .controls { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 18px 18px; border-top: 1px solid var(--border); }
      button { appearance: none; padding: 10px 14px; font-weight: 600; color: var(--text); background: #18181c; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
      button.primary { background: #2b2b31; }
      button.accent { background: #1f1f24; }
      .preview-wrap { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 18px; }
      .canvas { display: flex; align-items: flex-start; gap: 10px; width: 500px; padding: 8px 12px; color: #111; background: #fff; border: 1px solid #eaecef; }
      .dark .canvas { background: #ffffff; color: #111; }
      .avatar { flex: 0 0 48px; width: 48px; height: 48px; margin-top: 2px; object-fit: cover; border-radius: 50%; background: #ddd; }
      .name { font-weight: 600; color: #6a7282; }
      .text { margin: 4px 0 10px; font-size: 16px; line-height: 1.5; color: inherit; }
      .actions { display: flex; align-items: center; justify-content: space-between; }
      .actions-right, .actions-left { display: flex; align-items: center; }
      .actions-left { gap: 18px; }
      .actions-right { gap: 12px; }
      .date { font-size: 14px; font-weight: 400; color: #0000007a; }
      .like { display: flex; align-items: center; gap: 6px; font-weight: 400; color: #0000007a; fill: #0000009a; }
      .dislike { display: flex; align-items: center; transform: scaleX(-1); fill: #0000009a; }
      .reply { font-weight: 500; color: #0000008a; }
      .muted { color: #9ca3af; }
      .canvas-wrap { display: flex; justify-content: center; }
      .content { flex: 1; }
      .btn-toggle { display: inline-flex; background: #18181c; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
      .btn-toggle__btn { appearance: none; border: 0; padding: 10px 12px; background: transparent; color: var(--text); font-weight: 600; cursor: pointer; }
      .btn-toggle__btn + .btn-toggle__btn { border-left: 1px solid var(--border); }
      .btn-toggle__btn.is-active { background: #2b2b31; }
      .btn-toggle__btn:focus-visible { outline: 2px solid #8ab4f8; outline-offset: 2px; }
      .hidden { display: none !important; }
      /* New: TikTok HTML paste area styling */
      .tiktok-paste { margin: 18px 0; }
    </style>
  </head>
  <body class="dark">
    <div class="app">
      <div class="card">
        <form class="form" id="form">
          <label>Avatar <span class="hint">(opsional)</span></label>
          <input type="text" id="avatarInput" placeholder="Masukkan URL gambar" />
          <div class="row">
            <div>
              <label>Username</label>
              <input type="text" id="username" placeholder="Masukkan username" value="" />
            </div>
            <div>
              <label>Tanggal (MM-DD)</label>
              <input type="text" id="date" placeholder="MM-DD" value="" />
            </div>
          </div>
          <label>Komentar</label>
          <textarea placeholder="Masukkan komentar" id="comment"></textarea>
          <div class="row">
            <div>
              <label>Likes</label>
              <input type="text" id="likes" placeholder="Masukkan likes" value="" />
            </div>
            <div>
              <label>Tampilkan Verified Badge</label>
              <div class="btn-toggle" id="verifiedButtons" role="group" aria-label="Verified toggle">
                <button type="button" class="btn-toggle__btn is-active" data-value="off" aria-pressed="true">Sembunyikan</button>
                <button type="button" class="btn-toggle__btn" data-value="on" aria-pressed="false">Tampilkan</button>
              </div>
              <input type="hidden" id="verifiedToggle" value="off" />
            </div>
          </div>
          <!-- New TikTok comment HTML paste -->
          <div class="tiktok-paste">
            <label>Paste HTML TikTok comment</label>
            <textarea id="tiktokHtmlInput" placeholder="Paste kode HTML comment TikTok di sini..."></textarea>
            <button type="button" id="extractFromHtml" style="margin-top:10px;">Autofill dari HTML</button>
          </div>
        </form>
      </div>
      <!-- Preview area unchanged -->
      <div class="card preview-wrap">
        <div class="canvas-wrap">
          <div id="capture" class="canvas">
            <img id="avatar" class="avatar" src="https://i.pravatar.cc/150?img=3" alt="avatar" />
            <div class="content">
              <div>
                <span class="name" id="nameOut"></span>
                <svg id="verifiedBadge" class="hidden" color="inherit" font-size="12" viewBox="0 0 48 48" fill="currentColor" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" aria-label="Verified"><g clip-path="url(#Icon_Color-Verified_Badge_svg__a)"><path d="M0 24a24 24 0 1 1 48 0 24 24 0 0 1-48 0Z" fill="#20D5EC"></path><path fill-rule="evenodd" clip-rule="evenodd" d="M37.12 15.88a3 3 0 0 1 0 4.24l-13.5 13.5a3 3 0 0 1-4.24 0l-8.5-8.5a3 3 0 1 1 4.24-4.24l6.38 6.38 11.38-11.38a3 3 0 0 1 4.24 0Z" fill="#fff"></path></g><defs><clipPath id="Icon_Color-Verified_Badge_svg__a"><path fill="#fff" d="M0 0h48v48H0z"></path></clipPath></defs></svg>
              </div>
              <div class="text" id="commentOut"></div>
              <div class="actions">
                <div class="actions-left">
                  <span class="date" id="dateOut"></span>
                  <div class="reply">Reply</div>
                </div>
                <div class="actions-right">
                  <div class="like">
                    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M442.9 144..."></path></svg>
                    <span id="likesOut"></span>
                  </div>
                  <div class="dislike">
                    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M424 96L431.4..."></path></svg>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="controls">
          <button class="primary" type="button" id="download">Download</button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
      const $ = (q) => document.querySelector(q);
      const username = $("#username");
      const date = $("#date");
      const comment = $("#comment");
      const likes = $("#likes");
      const nameOut = $("#nameOut");
      const dateOut = $("#dateOut");
      const commentOut = $("#commentOut");
      const likesOut = $("#likesOut");
      const verifiedBadge = $("#verifiedBadge");
      const verifiedHidden = $("#verifiedToggle");
      const verifiedButtons = $("#verifiedButtons");
      function setVerified(val) {
        verifiedHidden.value = val;
        verifiedButtons.querySelectorAll(".btn-toggle__btn").forEach((btn) => {
          const active = btn.dataset.value === val;
          btn.classList.toggle("is-active", active);
          btn.setAttribute("aria-pressed", active ? "true" : "false");
        });
        sync();
      }
      verifiedButtons.addEventListener("click", (e) => {
        const btn = e.target.closest(".btn-toggle__btn");
        if (!btn) return;
        setVerified(btn.dataset.value);
      });
      function sync() {
        nameOut.textContent = username.value.trim() || "username";
        dateOut.textContent = date.value.trim() || "MM-DD";
        commentOut.textContent = comment.value.trim() || "Comment comment comment comment";
        likesOut.textContent = likes.value || "666";
        const verifiedOn = verifiedHidden.value === "on";
        verifiedBadge.classList.toggle("hidden", !verifiedOn);
      }
      [username, date, comment, likes].forEach((el) => {
        el.addEventListener("input", sync);
      });
      sync();
      // Avatar upload
      const avatarInput = document.getElementById("avatarInput");
      const avatar = document.getElementById("avatar");
      avatarInput.addEventListener("input", (e) => {
        const url = e.target.value.trim();
        if (url) avatar.src = url;
      });
      // Download
      document.getElementById("download").addEventListener("click", async () => {
        const node = document.getElementById("capture");
        const scale = 2;
        const canvas = await html2canvas(node, { backgroundColor: null, scale, useCORS: true });
        const link = document.createElement("a");
        link.download = `comment-${Date.now()}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
      // New feature: Extract TikTok comment from HTML
      document.getElementById('extractFromHtml').addEventListener('click', function() {
        const html = document.getElementById('tiktokHtmlInput').value;
        if (!html.trim()) return;
        try {
          const dom = document.createElement('div');
          dom.innerHTML = html;
          // Extract avatar
          const avatarEl = dom.querySelector('img');
          if (avatarEl) {
            avatarInput.value = avatarEl.src;
            avatar.src = avatarEl.src;
          }
          // Extract username
          const usernameEl = dom.querySelector('p');
          if (usernameEl) {
            username.value = usernameEl.textContent;
          }
          // Extract comment
          const commentEl = dom.querySelector('[data-e2e^="comment-level-"]');
          if (commentEl) {
            comment.value = commentEl.textContent;
          }
          // Extract likes
          const likesEl = dom.querySelector('.css-bww7mr-5e6d46e3--DivLikeContainer span');
          if (likesEl) {
            likes.value = likesEl.textContent;
          }
          // Extract tanggal
          const tanggalEl = dom.querySelector('.css-17on028-5e6d46e3--DivCommentSubContentWrapper span');
          if (tanggalEl) {
            date.value = tanggalEl.textContent;
          }
          sync();
        } catch (err) { alert('Gagal ekstrak HTML!'); }
      });
    </script>
  </body>
</html>
